[build]
  command = "mkdir -p dist && cp index.html styles.css script.js firebase-config.js cloud-model.js oral-check.js cloud.js _headers dist/"
  publish = "dist"

[build.environment]
  # Public Firebase Web API key only; other secret scanning remains enabled.
  SECRETS_SCAN_SMART_DETECTION_OMIT_VALUES = "AIzaSyDmTzlpcEsbCRVeMnu2fDnmMoEdzf9B3aM"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache"
